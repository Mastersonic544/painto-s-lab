# Render blueprint for the Painto's Lab converter backend.
# Create the service from the Render dashboard ("New +" -> "Blueprint")
# pointed at this repo, or copy these settings into a Web Service.
#
# Render injects PORT automatically; the server reads it.
# Set the three secrets below in the Render dashboard (sync: false = not
# stored in git, you fill them in per environment).
services:
  - type: web
    name: paintos-converter
    runtime: node
    # 'free' has 0.1 shared CPU / 512MB — tight for the engine. 'starter' is
    # strongly recommended so conversions don't crawl or OOM.
    plan: free
    buildCommand: npm install
    startCommand: npm run converter
    # No healthCheckPath on purpose: the conversion is CPU-bound and blocks the
    # event loop, so an HTTP health check would time out mid-job and Render
    # would restart the service, killing the conversion. Render still verifies
    # the port is bound at deploy. /health remains available for manual checks.
    autoDeploy: true
    envVars:
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: VITE_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: VITE_CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: CONVERTER_SECRET
        sync: false
